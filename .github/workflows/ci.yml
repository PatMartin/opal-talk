name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install (core + dev tools, no engine runtimes)
        run: pip install -e ".[dev]"
      - name: Editable install sanity (contract loads, entry points start)
        shell: bash
        run: |
          python -c "from importlib.metadata import version; import opal_talk; from opal_talk.contract import load_contract, contract_operations; spec = load_contract(); assert spec['info']['version'] == version('opal-talk') == opal_talk.__version__ and contract_operations()"
          opal-talk-svc --help >/dev/null
          opal-talk --help >/dev/null
          opal --help >/dev/null
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (includes contract consistency tests; no real engines)
        run: pytest -m "not piper and not kokoro"

  packaging:
    name: wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: pip wheel --no-deps -w dist .
      - name: Wheel bundles the OpenAPI contract
        run: python -c "import glob, zipfile; whl = glob.glob('dist/*.whl')[0]; assert 'opal_talk/contract/opal_talk.yaml' in zipfile.ZipFile(whl).namelist(), whl"
      - name: Install wheel into a clean venv
        shell: bash
        run: |
          python -m venv .pkgenv
          if [ -x .pkgenv/bin/python ]; then PY=.pkgenv/bin/python; else PY=.pkgenv/Scripts/python.exe; fi
          "$PY" -m pip install dist/*.whl
      - name: Verify installed package (bundled contract loads, entry points start)
        shell: bash
        run: |
          if [ -x .pkgenv/bin/python ]; then BIN=.pkgenv/bin; else BIN=.pkgenv/Scripts; fi
          "$BIN/python" -c "from importlib.metadata import version; import opal_talk; from opal_talk.contract import load_contract, contract_operations; spec = load_contract(); assert spec['info']['version'] == version('opal-talk') == opal_talk.__version__; assert contract_operations()"
          "$BIN/opal-talk-svc" --help >/dev/null
          "$BIN/opal-talk" --help >/dev/null
          "$BIN/opal" --help >/dev/null

  engines:
    name: release validation (real engines, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with Piper runtime
        run: pip install -e ".[piper,dev]"
      - name: Download public Piper voice (en_US-amy-low, ~25MB)
        run: |
          mkdir -p piper/voices
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/amy/low
          curl -fL "$BASE/en_US-amy-low.onnx" -o piper/voices/en_US-amy-low.onnx
          curl -fL "$BASE/en_US-amy-low.onnx.json" -o piper/voices/en_US-amy-low.onnx.json
      - name: Release validation (piper)
        env:
          OPAL_TALK_TEST_PIPER_MODEL: ${{ github.workspace }}/piper/voices/en_US-amy-low.onnx
        run: pytest -m piper tests/ -v -s

  spa:
    name: spa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
