              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    post:
      tags:
      - backup
      operationId: validate_talk_backup_payload
      description: Validate supplied backup without side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /:
    get:
      summary: Root
      description: Return basic service identity and API version information.
      operationId: root__get
      responses:
        '200':
          description: Service identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /healthz:
    get:
      summary: Healthz
      description: 'Lightweight liveness endpoint suitable for process supervisors and container

        probes. This endpoint indicates that the HTTP service is alive; callers needing

        engine readiness should use `/api/v1/health/`.

        '
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessRead'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/health/live:
    get:
      tags:
      - health
      operationId: get_talk_health_live
      summary: Liveness probe
      responses:
        '200':
          description: Health probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
  /api/v1/health/ready:
    get:
      tags:
      - health
      operationId: get_talk_health_ready
      summary: Readiness probe
      responses:
        '200':
          description: Health probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '503':
          description: Readiness unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpalHealthProbe'
          headers:
            X-Opal-Session-Id:
              $ref: '#/components/headers/OpalSessionIdHeader'
            X-Opal-Transaction-Id:
              $ref: '#/components/headers/OpalTransactionIdHeader'
            X-Opal-Request-Id:
              $ref: '#/components/headers/OpalRequestIdHeader'
            X-Opal-Causation-Id:
              $ref: '#/components/headers/OpalCausationIdHeader'
        '422':
          $ref: '#/components/responses/OpalError422'
    parameters:
    - $ref: '#/components/parameters/OpalSessionIdHeader'
    - $ref: '#/components/parameters/OpalTransactionIdHeader'
    - $ref: '#/components/parameters/OpalRequestIdHeader'
    - $ref: '#/components/parameters/OpalCausationIdHeader'
components:
  parameters:
    EngineId:
      name: engine_id
      in: path
      required: true
      description: Stable implementation-defined identifier of an installed TTS engine.
      schema:
        type: string
        minLength: 1
      example: piper
    VoiceId:
      name: voice_id
      in: path
      required: true
      description: Globally unique OPAL voice identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      example: en-us-lessac-medium
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Numeric profile identifier.
      schema:
        type: integer
        minimum: 1
      example: 1
    BackupFilename:
      name: filename
      in: path
      required: true
      description: 'Filename/identifier of a backup managed by the service. It must not contain

        path separators or traversal components.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[^/\\]+$
      example: opal-talk-2026-10-04T230000Z.tar.gz
    OpalSessionIdHeader:
      name: X-Opal-Session-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalTransactionIdHeader:
      name: X-Opal-Transaction-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalRequestIdHeader:
      name: X-Opal-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
    OpalCausationIdHeader:
      name: X-Opal-Causation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
      description: OPAL suite context propagation; opaque and not an authentication credential.
  headers:
    AudioFormat:
      description: Logical output format returned in the response body.
      schema:
        $ref: '#/components/schemas/AudioFormat'
    SampleRate:
      description: Actual audio sample rate in Hz. Constant for the entire response body.
      schema:
        type: integer
        minimum: 8000
        maximum: 192000
      example: 22050
    Channels:
      description: Number of audio channels. OPAL Talk v1 returns mono audio only.
      schema:
        type: integer
        enum:
        - 1
    SampleFormat:
      description: PCM sample representation. OPAL Talk v1 standardizes on signed 16-bit little-endian.
      schema:
        type: string
        enum:
        - s16le
    ResolvedEngineId:
      description: Engine actually used for generation.
      schema:
        type: string
      example: piper
    ResolvedVoiceId:
      description: OPAL voice actually used for generation.
      schema:
        type: string
      example: en-us-lessac-medium
    ResolvedProfileId:
      description: Profile used to supply defaults, when a profile participated in resolution.
      schema:
        type: integer
        minimum: 1
      example: 1
    OpalSessionIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalTransactionIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalRequestIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
    OpalCausationIdHeader:
      description: Effective OPAL context for this response.
      schema:
        type: string
  responses:
    AudioResponse:
      description: 'Completed generated audio. The media type corresponds to the resolved

        `output_format`. PCM bodies are headerless S16LE mono samples.

        '
      headers:
        X-Opal-Audio-Format:
          $ref: '#/components/headers/AudioFormat'
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
      content:
        audio/wav:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    PcmStreamResponse:
      description: 'Progressive raw PCM audio stream. Bytes are S16LE, mono, with no container,

        framing, JSON envelope, or chunk metadata. The response ends when generation

        completes. Transport-level chunk boundaries have no audio semantic meaning.

        '
      headers:
        X-Opal-Audio-Format:
          description: Always `pcm` for this endpoint.
          schema:
            type: string
            enum:
            - pcm
        X-Opal-Sample-Rate:
          $ref: '#/components/headers/SampleRate'
        X-Opal-Channels:
          $ref: '#/components/headers/Channels'
        X-Opal-Sample-Format:
          $ref: '#/components/headers/SampleFormat'
        X-Opal-Engine-Id:
          $ref: '#/components/headers/ResolvedEngineId'
        X-Opal-Voice-Id:
          $ref: '#/components/headers/ResolvedVoiceId'
        X-Opal-Profile-Id:
          $ref: '#/components/headers/ResolvedProfileId'
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request is structurally valid but conflicts with current configuration or resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Input text exceeds the service's configured maximum accepted request size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationErrorResponse:
      description: Request validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    GenerationFailed:
      description: TTS generation failed after the request was accepted for processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The resolved engine or a required TTS runtime dependency is currently unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperationFailed:
      description: The requested operational action failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OpalError412:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OpalError428:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
    OpalError422:
      description: OPAL standard error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpalError'
  schemas:
    AudioFormat:
      type: string
      enum:
      - wav
      - pcm
      description: '`wav` is a completed WAV container. `pcm` is headerless signed 16-bit

        little-endian mono PCM.

        '
      example: wav
    EngineOptions:
      type: object
      additionalProperties: true
      description: 'Opaque engine-specific options. The public contract deliberately does not define

        these keys or values. They are interpreted only by the resolved engine adapter.


        Portable behavior should use the standardized OPAL fields whenever possible.

        Implementations SHOULD reject unsupported or invalid engine options rather than

        silently ignoring them. Sensitive credentials or secrets SHOULD NOT be exposed

        through this object.

        '
      example:
        noise_scale: 0.667
    EngineRead:
      type: object
      required:
      - engine_id
      - name
      - enabled
      - available
      - options
      - metadata
      properties:
        engine_id:
          type: string
          minLength: 1
          description: Stable engine identifier used by API requests and voice registrations.
          example: piper
        name:
          type: string
          minLength: 1
          description: Human-readable engine name.
          example: Piper
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional human-readable engine description.
          example: Local neural text-to-speech engine
        enabled:
          type: boolean
          description: Whether OPAL Talk is administratively allowed to route generation to this engine.
          example: true
        available:
          type: boolean
          description: Whether the implementation can currently initialize and use the engine.
          example: true
        options:
          $ref: '#/components/schemas/EngineOptions'
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: 'Read-only implementation-reported engine metadata such as runtime version or

            adapter information. Clients must not require engine-specific metadata keys.

            '
          example:
            version: 1.3.0
    EngineUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Mutable engine configuration.
      properties:
        enabled:
          type: boolean
          description: Enable or disable routing to this installed engine.
        options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        enabled: true
        options:
          use_cuda: false
    VoiceCreate:
      type: object
      additionalProperties: false
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      properties:
        voice_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          description: Globally unique OPAL identifier for this voice registration.
          example: en-us-lessac-medium
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional human-readable description.
        engine_id:
          type: string
          minLength: 1
          description: Installed engine that owns/interprets `engine_voice_ref`.
          example: piper
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: 'Opaque engine-specific reference to a voice/model resource already available

            on the host. Although an implementation may use a filesystem path here,

            clients must treat the value as an opaque string.

            '
          example: /opt/opal/voices/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Optional BCP 47-style language tag or implementation-provided language label.
          example: en-US
        enabled:
          type: boolean
          default: true
          description: Whether this voice may be selected for generation.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        voice_id: en-us-lessac-medium
        name: Lessac Medium
        engine_id: piper
        engine_voice_ref: /opt/opal/voices/en_US-lessac-medium.onnx
        language: en-US
        enabled: true
        engine_options: {}
    VoiceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a registered voice.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        engine_id:
          type: string
          minLength: 1
          description: Reassign this registration to another installed engine.
        engine_voice_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: New opaque host-resource reference interpreted by the engine.
        language:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
        enabled:
          type: boolean
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    VoiceRead:
      type: object
      required:
      - voice_id
      - name
      - engine_id
      - engine_voice_ref
      - enabled
      - engine_options
      - metadata
      - created_at
      - updated_at
      properties:
        voice_id:
          type: string
          description: Globally unique OPAL voice identifier.
          example: en-us-lessac-medium
        name:
          type: string
          description: Human-readable voice name.
          example: Lessac Medium
        description:
          anyOf:
          - type: string
          - type: 'null'
        engine_id:
          type: string
          description: Engine associated with this registration.
          example: piper
        engine_voice_ref:
          type: string
          description: Opaque engine-specific reference to the host-resident voice/model resource.
          example: /opt/opal/voices/en_US-lessac-medium.onnx
        language:
          anyOf:
          - type: string
          - type: 'null'
          example: en-US
        enabled:
          type: boolean
        native_sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          readOnly: true
          description: Native voice/engine sample rate when known; not a guarantee about requested output rate.
          example: 22050
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
        metadata:
          type: object
          additionalProperties: true
          readOnly: true
          description: Read-only engine-reported voice metadata. Keys are not standardized.
          example:
            quality: medium
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PortableGenerationOptions:
      type: object
      description: 'Engine-neutral generation controls shared by completed and streaming generation.

        These fields are standardized by OPAL Talk and must retain the same meaning

        regardless of the selected engine.

        '
      properties:
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
          description: Speech-rate multiplier. `1.0` is normal speed; `0.5` is half speed; `2.0` is double
            speed.
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
          description: Linear output gain. `1.0` is unchanged, `0.0` is silence, and `2.0` is approximately
            double amplitude before clipping control.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: 'Requested output sample rate in Hz. If omitted/null, the service chooses an

            appropriate rate, commonly the voice''s native rate. If explicitly requested,

            the accepted response must use exactly this rate.

            '
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    ProfileCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - voice_id
      description: Create a reusable TTS generation preset.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique or human-distinguishable profile name.
          example: default
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        is_active:
          type: boolean
          default: false
          description: If true, activate this profile and deactivate all others.
        voice_id:
          type: string
          minLength: 1
          description: Registered voice used by default for this profile.
          example: en-us-lessac-medium
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
        output_format:
          allOf:
          - $ref: '#/components/schemas/AudioFormat'
          default: wav
          description: Default format for completed `/generate` requests using this profile.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          default: null
          description: Optional default output sample rate. Null lets the service choose.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        name: default
        description: General-purpose local speech profile
        is_active: true
        voice_id: en-us-lessac-medium
        speed: 1.0
        volume: 1.0
        output_format: wav
        sample_rate: null
        engine_options: {}
    ProfileUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Partial update to a generation profile.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        is_active:
          type: boolean
          description: Setting true activates this profile and deactivates all others.
        voice_id:
          type: string
          minLength: 1
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
        output_format:
          $ref: '#/components/schemas/AudioFormat'
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    ProfileRead:
      type: object
      required:
      - id
      - name
      - is_active
      - voice_id
      - speed
      - volume
      - output_format
      - engine_options
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        is_active:
          type: boolean
        voice_id:
          type: string
        speed:
          type: number
          format: float
        volume:
          type: number
          format: float
        output_format:
          $ref: '#/components/schemas/AudioFormat'
        sample_rate:
          anyOf:
          - type: integer
          - type: 'null'
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        name: default
        description: General-purpose local speech profile
        is_active: true
        voice_id: en-us-lessac-medium
        speed: 1.0
        volume: 1.0
        output_format: wav
        sample_rate: null
        engine_options: {}
        created_at: '2026-10-04T23:00:00Z'
        updated_at: '2026-10-04T23:00:00Z'
    GenerateRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for completed speech audio. Any omitted generation setting is resolved

        from the selected/active profile and then service defaults.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: 'Plain text to speak. Long text may be internally chunked. The maximum

            accepted request length is service-configurable and intentionally not fixed

            by the OpenAPI schema.

            '
          example: Hello from OPAL Talk.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use. If omitted/null, the active profile may supply defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override. Takes precedence over the profile voice.
          example: en-us-lessac-medium
        engine_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: 'Optional advanced engine override. Normally the resolved voice selects its

            registered engine. Incompatible overrides are rejected with `409 Conflict`.

            '
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
          description: Request-level speech-rate override; `1.0` is normal speed.
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
          description: Request-level linear gain override; `1.0` is unchanged.
        output_format:
          anyOf:
          - $ref: '#/components/schemas/AudioFormat'
          - type: 'null'
          description: Request-level completed-audio format override.
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested output sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: The quick brown fox jumps over the lazy dog.
        voice_id: en-us-lessac-medium
        speed: 1.0
        volume: 1.0
        output_format: wav
        engine_options: {}
    GenerateStreamRequest:
      type: object
      additionalProperties: false
      required:
      - text
      description: 'Request for progressively streamed speech. The wire format is fixed to raw PCM,

        so there is intentionally no `output_format` property.

        '
      properties:
        text:
          type: string
          minLength: 1
          description: Plain text to speak. Long text may be internally chunked.
          example: This audio begins streaming as it is generated.
        profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Explicit profile to use; otherwise the active profile may provide defaults.
        voice_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Request-level voice override.
        engine_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: Optional advanced engine override; incompatible overrides are rejected.
        speed:
          anyOf:
          - type: number
            format: float
            minimum: 0.25
            maximum: 4.0
          - type: 'null'
        volume:
          anyOf:
          - type: number
            format: float
            minimum: 0.0
            maximum: 2.0
          - type: 'null'
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          description: Optional requested PCM stream sample rate in Hz.
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
      example:
        text: Stream this sentence as raw PCM audio.
        profile_id: 1
        speed: 1.0
        volume: 1.0
        sample_rate: 22050
        engine_options: {}
    VoiceTestRequest:
      type: object
      additionalProperties: false
      description: 'Parameters for generating a short completed-audio voice test. If `text` is

        omitted, the implementation uses a short built-in neutral test phrase.

        '
      properties:
        text:
          type: string
          minLength: 1
          default: This is a test of the selected OPAL Talk voice.
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4.0
          default: 1.0
        volume:
          type: number
          format: float
          minimum: 0.0
          maximum: 2.0
          default: 1.0
        output_format:
          allOf:
          - $ref: '#/components/schemas/AudioFormat'
          default: wav
        sample_rate:
          anyOf:
          - type: integer
            minimum: 8000
            maximum: 192000
          - type: 'null'
          default: null
        engine_options:
          $ref: '#/components/schemas/EngineOptions'
    ValidationMessage:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable machine-readable diagnostic code when possible.
          example: model_not_found
        message:
          type: string
          description: Human-readable diagnostic message.
          example: The configured voice resource could not be resolved on this host.
        field:
          anyOf:
          - type: string
          - type: 'null'
          description: Related configuration field, when applicable.
          example: engine_voice_ref
        details:
          type: object
          additionalProperties: true
          description: Optional implementation-specific diagnostic context.
    ValidationResult:
      type: object
      required:
      - valid
      - errors
      - warnings
      - details
      properties:
        valid:
          type: boolean
          description: True when the validated object/configuration is usable under current validation rules.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
        details:
          type: object
          additionalProperties: true
          description: Optional implementation-specific validation details.
      example:
        valid: true
        errors: []
        warnings: []
        details: {}
    SettingRead:
      type: object
      required:
      - id
      - key
      - value
      - updated_at
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
          description: String setting value, matching the OPAL Listen setting convention.
        updated_at:
          type: string
          format: date-time
    SettingUpdate:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          description: New string value for the setting.
    EngineHealthRead:
      type: object
      required:
      - engine_id
      - enabled
      - available
      properties:
        engine_id:
          type: string
        enabled:
          type: boolean
        available:
          type: boolean
        message:
          anyOf:
          - type: string
          - type: 'null'
    HealthRead:
      type: object
      required:
      - status
      - version
      - engines
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - error
          description: 'Overall readiness state. `ok` means required service functions are ready;

            `degraded` means the service is running but one or more configured resources

            are unavailable; `error` means normal generation is not currently usable.

            '
        version:
          type: string
          example: 1.0.0
        active_profile_id:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineHealthRead'
        details:
          type: object
          additionalProperties: true
          description: Optional non-portable diagnostic information.
      example:
        status: ok
        version: 1.0.0
        active_profile_id: 1
        engines:
        - engine_id: piper
          enabled: true
          available: true
          message: null
        details: {}
    BackupRead:
      type: object
      required:
      - filename
      - created_at
      properties:
        filename:
          type: string
        created_at:
          type: string
          format: date-time
        size_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      example:
        filename: opal-talk-2026-10-04T230000Z.tar.gz
        created_at: '2026-10-04T23:00:00Z'
        size_bytes: 18432
    BackupCreateResponse:
      type: object
      required:
      - filename
      properties:
        filename:
          type: string
        message:
          type: string
      example:
        filename: opal-talk-2026-10-04T230000Z.tar.gz
        message: Backup created successfully.
    ConfigExport:
      type: object
      required:
      - version
      - exported_at
      - engines
      - voices
      - profiles
      - settings
      description: 'Portable logical configuration snapshot. Engine/voice host assets are referenced,

        not embedded. Consumers should tolerate future additive fields.

        '
      properties:
        version:
          type: string
          description: OPAL Talk configuration schema/service version.
          example: 1.0.0
        exported_at:
          type: string
          format: date-time
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineRead'
        voices:
          type: array
          items:
            $ref: '#/components/schemas/VoiceRead'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileRead'
        settings:
          type: object
          additionalProperties: true
    ConfigImportResult:
      type: object
      required:
      - success
      - validation
      properties:
        success:
          type: boolean
        validation:
          $ref: '#/components/schemas/ValidationResult'
        message:
          anyOf:
          - type: string
          - type: 'null'
      example:
        success: true
        validation:
          valid: true
          errors: []
          warnings: []
          details: {}
        message: Configuration imported successfully.
    OperationResult:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      example:
        success: true
        message: Backup restored successfully.
        details: {}
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: voice_engine_mismatch
        message:
          type: string
          description: Human-readable error message.
          example: The requested engine cannot use the resolved voice.
        details:
          type: object
          additionalProperties: true
          description: Optional structured diagnostic details.
      example:
        code: voice_engine_mismatch
        message: The requested engine cannot use the resolved voice.
        details:
          voice_id: en-us-lessac-medium
          requested_engine_id: kokoro
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/RequestValidationError'
      description: Validation error shape compatible with the OPAL Listen/FastAPI-style contract.
    RequestValidationError:
      type: object
      required:
      - loc
      - msg
      - type
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
          description: Location of the invalid request value.
        msg:
          type: string
        type:
          type: string
        input:
          description: Optional offending input value.
    ServiceInfo:
      type: object
      required:
      - name
      - version
      - api_version
      properties:
        name:
          type: string
          example: opal-talk-svc
        version:
          type: string
          example: 1.0.0
        api_version:
          type: string
          example: v1
        description:
          type: string
          example: Implementation-neutral OPAL text-to-speech service
    LivenessRead:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          example: ok
    OpalError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          - transaction_id
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            request_id:
              type: string
            transaction_id:
              type: string
            session_id:
              type:
              - string
              - 'null'
            causation_id:
              type:
              - string
              - 'null'
    OpalCursorPageMetadata:
      type: object
      required:
      - next_cursor
      - has_more
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    OpalHealthProbe:
      type: object
      required:
      - status
      - ready
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        ready:
          type: boolean
        details:
          type: object
          additionalProperties: true
x-opal-context-standard:
  version: '1.2'
  headers:
  - X-Opal-Session-Id
  - X-Opal-Transaction-Id
  - X-Opal-Request-Id
  - X-Opal-Causation-Id
  session_mode: context-only
  id_format: opaque-printable-ascii-1-to-128
  transaction_atomicity: false
  events:
    propagate:
    - session_id
    - transaction_id
    - request_id
    - causation_id
    metadata_schema_version: '1.0'
    zero_mq_frames: 2
  pagination:
    history: cursor
    configuration: none
    default_limit: 100
    max_limit: 500
  concurrency:
    settings_and_config_mutations: strong-etag-if-match-required
    missing_status: 428
    stale_status: 412
  streaming: Include HTTP context headers before bytes; after headers are sent, failures are represented by
    transport-specific terminal events or stream termination; no invented resumability.
